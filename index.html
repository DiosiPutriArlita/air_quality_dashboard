<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus Sesi 5 - Dasbor Pemantauan Kualitas Udara</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        color: #f8fafc;
        min-height: 100vh;
        padding: 32px 16px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    .header-banner {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 28px;
        margin-bottom: 28px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
    }

    .header-title h1 {
        font-size: 26px;
        font-weight: 800;
        background: linear-gradient(to right, #ffffff, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
    }

    .header-title p {
        font-size: 14px;
        color: #94a3b8;
        font-weight: 500;
    }

    .filter-box {
        background: rgba(15, 23, 42, 0.6);
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .filter-box label {
        font-size: 13px;
        font-weight: 600;
        color: #cbd5e1;
    }

    .filter-box select {
        background-color: #1e293b;
        color: #f8fafc;
        border: 1px solid #475569;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        outline: none;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .filter-box select:hover {
        border-color: #818cf8;
    }

    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-bottom: 28px;
    }

    .card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 24px;
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.4);
    }

    .card-aqi {
        border-top: 4px solid #f59e0b;
    }

    .card-pollutant {
        border-top: 4px solid #38bdf8;
    }

    .card-temp {
        border-top: 4px solid #f43f5e;
    }

    .card-icon-bg {
        position: absolute;
        right: 16px;
        top: 16px;
        font-size: 42px;
        opacity: 0.15;
    }

    .card h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #94a3b8;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .card-value {
        font-size: 36px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 12px;
    }

    .status-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .chart-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .chart-header h2 {
        font-size: 18px;
        font-weight: 700;
        color: #f1f5f9;
    }

    .chart-container {
        position: relative;
        height: 320px;
        width: 100%;
    }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-banner">
            <div class="header-title">
                <h1>Dasbor Pemantauan Indeks Kualitas Udara (AQI)</h1>
                <p>Studi Kasus Sesi 5 - Human-Computer Interaction & Data Visualization</p>
            </div>
            <div class="filter-box">
                <label for="cityFilter">Pilih Wilayah:</label>
                <select id="cityFilter" onchange="updateDashboard()">
                    <option value="jakarta">Jakarta Pusat</option>
                    <option value="bandung">Bandung</option>
                    <option value="surabaya">Surabaya</option>
                </select>
            </div>
        </header>

        <section class="kpi-grid">
            <div class="card card-aqi" id="cardAqi">
                <div class="card-icon-bg">🍃</div>
                <h3>Indeks Kualitas Udara (AQI)</h3>
                <div class="card-value" id="aqiValue">125</div>
                <span id="aqiStatus" class="status-badge">Tidak Sehat (Kelompok Rentan)</span>
            </div>
            <div class="card card-pollutant">
                <div class="card-icon-bg">💨</div>
                <h3>Polutan Utama</h3>
                <div class="card-value" id="mainPollutant">PM2.5</div>
                <span class="status-badge" style="background-color: #0284c7;">Partikel Halus</span>
            </div>
            <div class="card card-temp">
                <div class="card-icon-bg">🌡️</div>
                <h3>Suhu Lingkungan</h3>
                <div class="card-value" id="temperature">31°C</div>
                <span class="status-badge" style="background-color: #e11d48;">Cerah Berawan</span>
            </div>
        </section>

        <section class="chart-card">
            <div class="chart-header">
                <h2>Tren AQI 24 Jam Terakhir</h2>
            </div>
            <div class="chart-container">
                <canvas id="aqiChart"></canvas>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
